<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Peak Intervals Workout</title>

    <!-- Workout share landing — dynamic content, exclude from search index -->
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://www.peakintervalapp.com/download">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <!-- App Banner -->
    <meta name="apple-itunes-app" content="app-id=6741055716">

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Peak Intervals Workout">
    <meta property="og:description" content="Check out this HIIT workout in Peak Intervals!">
    <meta property="og:image" content="https://www.peakintervalapp.com/assets/app_icon.png">
    <meta property="og:url" content="https://www.peakintervalapp.com/download">
    <meta property="og:type" content="fitness.course">

    <!-- Twitter Card Meta Tags (Optional but recommended) -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Peak Intervals Workout">
    <meta name="twitter:description" content="Check out this HIIT workout!">
    <meta name="twitter:image" content="https://www.peakintervalapp.com/assets/app_icon.png">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #181F3B;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .app-icon {
            width: 120px;
            height: 120px;
            border-radius: 25px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }
        .app-store-button {
            background: #FF9500;
            color: black;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-weight: 600;
            margin-top: 20px;
            display: inline-block;
            transition: all 0.2s;
            font-size: 18px;
        }
        .app-store-button:hover {
            background: #FFB340;
            transform: scale(1.02);
        }
        .message {
            margin: 20px 0;
            font-size: 18px;
            line-height: 1.5;
            opacity: 0.9;
        }
        .footer-links {
            margin-top: 40px;
            font-size: 14px;
            opacity: 0.7;
        }
        .footer-links a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }
        .footer-links a:hover {
            text-decoration: underline;
            opacity: 1;
        }
    </style>

    <script>
        var APP_STORE_URL = "https://apps.apple.com/us/app/peak-interval-hiit-timer/id6741055716";
        var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.roli.intervals";
        var ANDROID_PACKAGE = "com.roli.intervals";

        var isAndroid = /android/i.test(navigator.userAgent);

        // Where a workout payload can hide, in the order the app has ever
        // produced: #sharedWorkout=, ?workout= (what the /w/ redirect in
        // vercel.json rewrites to), the path itself, then the referrer for
        // links that arrived through another redirect.
        function payloadFromUrl() {
            var hash = window.location.hash;
            if (hash && hash.indexOf('#sharedWorkout=') === 0) {
                return hash.substring('#sharedWorkout='.length);
            }
            var workout = new URLSearchParams(window.location.search).get('workout');
            if (workout) return workout;
            for (var i = 0, sources = [window.location.pathname, document.referrer]; i < sources.length; i++) {
                var parts = (sources[i] || '').split('/w/');
                if (parts.length > 1) {
                    var data = parts[1].replace(/\/$/, '');
                    if (data) return data;
                }
            }
            return null;
        }

        // Android gets an intent: URI rather than the custom scheme. Chrome
        // resolves it to the app when installed and follows
        // browser_fallback_url to Play when it isn't — a bare
        // peakintervals:// link just dead-ends on a device without the app.
        function openInApp(target) {
            if (isAndroid) {
                window.location.href = 'intent://' + target + '#Intent' +
                    ';scheme=peakintervals' +
                    ';package=' + ANDROID_PACKAGE +
                    ';S.browser_fallback_url=' + encodeURIComponent(PLAY_STORE_URL) +
                    ';end';
            } else {
                window.location.href = 'peakintervals://' + target;
            }
        }

        // Show the store that matches the device. Done before the redirect so
        // the right button is already there when the app isn't installed and
        // the user lands back on this page.
        function showStoreButton() {
            var store = document.getElementById('store-button');
            if (!store) return;
            if (isAndroid) {
                store.href = PLAY_STORE_URL;
                store.textContent = 'Get it on Google Play';
            } else {
                store.href = APP_STORE_URL;
                store.textContent = 'Download from App Store';
            }
        }

        window.onload = function() {
            showStoreButton();

            var payload = payloadFromUrl();
            if (payload) {
                openInApp('w/' + payload);
                return;
            }

            // Non-workout links: carry the path through to the app.
            var path = window.location.pathname;
            if (path.indexOf('/download') === 0) {
                path = path.substring('/download'.length) || '/';
            }
            openInApp(path.replace(/^\//, '') + window.location.search);
        }
    </script>
</head>
<body>
    <div class="container">
        <img src="/assets/app_icon.png" alt="Peak Intervals App Icon" class="app-icon">
        <h1>Opening Peak Intervals...</h1>
        <p class="message">If you have the app installed, click "Allow" when prompted.</p>
        <p class="message">Don't have the app yet?</p>
        <!-- Label and href are swapped to Google Play on Android by showStoreButton(). -->
        <a id="store-button" href="https://apps.apple.com/us/app/peak-interval-hiit-timer/id6741055716" class="app-store-button">
            Download from App Store
        </a>
        <div class="footer-links">
            <a href="/terms">Terms & Conditions</a>
            <a href="/privacy">Privacy Policy</a>
            <a href="/contact">Contact Us</a>
        </div>
    </div>
</body>
</html>
